# Fly.io: deploys from your local checkout, so a private GitHub repo needs no GitHub integration.
#   fly auth login
#   fly launch --copy-config --no-deploy --name <a-unique-name>     # edit app below if you skip --name
#   fly secrets set SUPABASE_URL=... SUPABASE_ANON_KEY=... SUPABASE_SERVICE_KEY=...
#   fly deploy
# The public address is https://<app>.fly.dev (also exposed to the app as FLY_APP_NAME).
app = "paladin-datum"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  COOKIE_SECURE = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"      # no cold starts while judges are looking
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
