name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm test && npm run build
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # unit tests only; installing electron's binary is not needed for them
      - run: cd desktop && npm ci --ignore-scripts && npm test
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: apc:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name apc-ci --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            --mount type=volume,source=apc-ci-data,target=/var/lib/apc \
            -p 127.0.0.1:8000:8000 \
            -e COOKIE_SECURE=0 -e DEMO_USER=demo@example.com \
            -e DEMO_PASSWORD=ci-demo-password apc:ci
          trap 'docker rm -f apc-ci; docker volume rm apc-ci-data' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              docker exec apc-ci sh -c 'git --version && mkdir -p "$DATA_DIR/jobs/smoke" && rmdir "$DATA_DIR/jobs/smoke"'
              exit 0
            fi
            sleep 1
          done
          docker logs apc-ci
          exit 1
