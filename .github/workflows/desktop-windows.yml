# Windows installer (NSIS .exe). PyInstaller does not cross-compile, so the engine is frozen on a Windows runner.
# Runs on pushes to release-* branches and v* tags, or by hand. The installer is uploaded as a workflow artifact;
# attaching it to a GitHub release is a separate, deliberate step.
name: Desktop (Windows)

on:
  push:
    branches: ['release-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.9.5

      - name: Backend environment
        working-directory: backend
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt

      - name: Backend tests (Windows)
        working-directory: backend
        env:
          APC_OSV: '0'
        run: .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider

      - name: Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Desktop unit tests
        working-directory: desktop
        run: npm test

      - name: Build the UI and freeze the engine
        working-directory: desktop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm run build:ui
          npm run build:backend

      - name: Engine smoke test (frozen paladin-server.exe)
        shell: pwsh
        run: |
          $exe = "desktop\build\backend\paladin-server\paladin-server.exe"
          $env:PORT = "8799"; $env:DESKTOP_MODE = "1"; $env:APC_DESKTOP_TOKEN = "t"; $env:APC_SKIP_DOTENV = "1"
          $env:DATA_DIR = "$env:RUNNER_TEMP\paladin-data"; $env:SEED_DIR = "$PWD\data"
          $env:SUPABASE_URL = "https://example.invalid"; $env:SUPABASE_ANON_KEY = "x"
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\engine.log" -RedirectStandardError "$env:RUNNER_TEMP\engine.err"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/health).StatusCode -eq 200 } catch {}
          }
          $paths = (Invoke-RestMethod http://127.0.0.1:8799/openapi.json).paths.PSObject.Properties.Name
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\engine.err" -Tail 40; throw "engine did not start" }
          if (-not ($paths -contains "/api/agent/fix")) { throw "agent routes missing from the frozen engine" }
          if (-not (Test-Path "data\mitre.json")) { throw "MITRE pack missing" }
          "engine OK: health 200, agent routes present"

      - name: Build the installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: App smoke test (installed layout)
        shell: pwsh
        working-directory: desktop
        run: |
          $env:PALADIN_SMOKE_TEST = "1"
          $out = & ".\dist\win-unpacked\Paladin.exe" "--user-data-dir=$env:RUNNER_TEMP\ud" 2>&1 | Out-String
          $line = ($out -split "`n" | Where-Object { $_ -like "SMOKE*" }) | Select-Object -First 1
          if (-not $line) { $out | Select-Object -Last 60; throw "app smoke test did not report" }
          $line
          if ($line -notmatch '"version":"') { throw "unexpected smoke output" }

      - uses: actions/upload-artifact@v4
        with:
          name: paladin-windows
          path: |
            desktop/dist/Paladin-Setup-*.exe
            desktop/dist/Paladin-Setup-*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
