  <text x="330" y="62" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial" font-size="22" font-weight="600" fill="#1f1f1f" letter-spacing="-0.3">Install Paladin</text>
  <text x="330" y="86" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial" font-size="13" fill="#6b6b6b">Drag Paladin into your Applications folder</text>
