appId: dev.paladin.desktop
productName: Paladin
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
  - build/icon-source.png      # window icon on Linux (macOS reads icon.icns from the bundle)
  - build/icon-win.png         # Windows: the PALADIN pixel-eye icon (window and installer)
extraResources:
  - from: build/backend/paladin-server
    to: backend
  - from: build/supabase.json      # public URL + anon key only (written by scripts/build-backend.js)
    to: supabase.json
  - from: ../frontend/dist
    to: ui
  - from: ../data
    to: data
    filter:
      - "inventory.yaml"
      - "attack_subset.json"
      - "benchmarks.json"
      - "samples/**/*"
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: Paladin-${version}-${arch}.${ext}
  target: [dmg, zip]        # both are required for electron-updater on macOS
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true            # needs APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID in the environment
# Drag-to-install disk image: 660x400 window, app on the left, Applications alias on the right, arrow between them.
# build/dmg-background.tiff is a retina multi-resolution image generated by scripts/make-icons.js.
dmg:
  title: Install ${productName}
  icon: build/icon.icns
  background: build/dmg-background.tiff
  iconSize: 112
  iconTextSize: 13
  window: { x: 220, y: 140, width: 660, height: 400 }
  contents:
    - { x: 180, y: 200, type: file }
    - { x: 480, y: 200, type: link, path: /Applications }
win:
  icon: build/icon-win.png
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces: GitHub turns spaces in release file names into dots, and latest.yml must name the file exactly,
  # or every installed copy fails to download its update.
  artifactName: Paladin-Setup-${version}.${ext}
publish:
  provider: github
  owner: Manipal-Hackathon-2026
  repo: DATUM
# Hardening: turn off the Electron features this app never uses (Electron fuses guide).
electronFuses:
  # Session cookies (including the long-lived refresh token) are encrypted on disk with the OS key store (DPAPI on
  # Windows). Without this fuse Electron writes them in plain text under %APPDATA%\Paladin\Network\Cookies.
  enableCookieEncryption: true
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
