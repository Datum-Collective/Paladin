# Build-only sandbox image. The request-serving application never receives a
# Docker socket; production execution requires an external sandbox manager.
services:
  sandbox-runner:
    profiles: ["sandbox-build"]
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: ${SANDBOX_IMAGE:-datum-sandbox:latest}
    command: ["true"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
