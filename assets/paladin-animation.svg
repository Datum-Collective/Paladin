<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-label="Animated ASCII paladin: scanning, finding a path, cutting it, verifying">
<title>Paladin</title>
<style>
.bg{fill:#131418} .card{fill:#232429;stroke:#3a3b42;stroke-width:1}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.art{font-size:15px;fill:#e8e8ea} .hot{fill:#e0605a} .dim{fill:#8c8c92}
.f{opacity:0;animation:cycle 12s steps(1,end) infinite}
.f1{animation-delay:0s} .f2{animation-delay:3s} .f3{animation-delay:6s} .f4{animation-delay:9s}
@keyframes cycle{0%{opacity:1}25%{opacity:0}100%{opacity:0}}
.scan{animation:sweep 3s linear infinite}
@keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(340px)}}
.cur{animation:blink 1s steps(1,end) infinite} @keyframes blink{50%{opacity:0}}
</style>
<rect class="bg" width="720" height="470" rx="14"/>
<rect class="card" x="14" y="14" width="692" height="442" rx="10"/>
